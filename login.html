<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Jaba Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0F0C;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        /* Animated Background */
        .bg-gradient-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, rgba(34, 197, 94, 0.08), transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(34, 197, 94, 0.05), transparent 50%);
            z-index: 0;
        }
        .floating-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.15), transparent);
            animation: float 20s infinite ease-in-out;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
        }
        .login-card {
            background: rgba(18, 24, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 2rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .login-card:hover {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1rem;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            color: white;
            width: 100%;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }
        .btn-primary {
            background: #22c55e;
            color: #0A0F0C;
            font-weight: 700;
            border-radius: 9999px;
            padding: 0.85rem 1.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn-primary:hover {
            background: #16a34a;
            transform: scale(0.98);
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            border: 1px solid rgba(34, 197, 94, 0.5);
            background: transparent;
            color: #EFF3EC;
            font-weight: 500;
            border-radius: 9999px;
            padding: 0.7rem 1.5rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-outline:hover {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.5s ease forwards;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .logo-float {
            animation: floatLogo 4s ease-in-out infinite;
        }
        .back-link {
            transition: all 0.2s;
        }
        .back-link:hover {
            color: #22c55e;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>
    <div class="bg-gradient-animation"></div>
    
    <!-- Floating Orbs -->
    <div class="floating-orb" style="width: 300px; height: 300px; top: -100px; right: -100px; animation-duration: 25s;"></div>
    <div class="floating-orb" style="width: 200px; height: 200px; bottom: -50px; left: -50px; animation-duration: 18s; animation-delay: -5s;"></div>
    <div class="floating-orb" style="width: 150px; height: 150px; top: 50%; left: 10%; animation-duration: 22s; animation-delay: -10s;"></div>

    <!-- Back to Home Button -->
    <a href="index.html" class="fixed top-6 left-6 z-50 flex items-center gap-2 text-gray-400 hover:text-emerald-400 transition text-sm back-link">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Home
    </a>

    <div class="w-full max-w-md px-4 relative z-10">
        <div class="text-center mb-8 animate-fade-up">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center shadow-2xl logo-float">
                    <i data-lucide="shopping-bag" class="w-10 h-10 text-white"></i>
                </div>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Welcome Back</h1>
            <p class="text-gray-400 text-sm mt-2">Sign in to access your digital library</p>
        </div>

        <div class="login-card p-8 animate-fade-up" style="animation-delay: 0.1s">
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input type="email" id="email" class="input-field" placeholder="you@example.com" required>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                        <a href="forgot-password.html" class="text-xs text-emerald-400 hover:text-emerald-300 transition">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-emerald-400 transition">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn-primary py-3 text-base font-bold mt-6">
                    Sign In
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-gray-400 text-sm">Don't have an account? <a href="signup.html" class="text-emerald-400 font-semibold hover:text-emerald-300 transition">Create one</a></p>
            </div>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-6 text-center animate-fade-up" style="animation-delay: 0.2s">
            <div class="inline-flex items-center gap-2 bg-emerald-500/5 border border-emerald-500/20 rounded-full px-4 py-2">
                <i data-lucide="info" class="w-3 h-3 text-emerald-400"></i>
                <span class="text-[10px] text-gray-500">Demo: demo@jabaa.com / any password (6+ chars)</span>
            </div>
        </div>
    </div>

    <script>
        // Supabase Config
        const SUPABASE_URL = "https://wuwfjdxgeoqcbqsbxuho.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_6urNqkD2HYEHZtmVXSS8jQ_ByVqLB5T";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;

        lucide.createIcons();

        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // Show toast function
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `custom-toast fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-xl backdrop-blur-lg shadow-xl animate-fade-up ${type === 'success' ? 'bg-emerald-500/20 border border-emerald-500/30' : 'bg-rose-500/20 border border-rose-500/30'}`;
            toast.innerHTML = `
                <div class="w-2 h-2 rounded-full ${type === 'success' ? 'bg-emerald-400' : 'bg-rose-400'} animate-pulse"></div>
                <span class="text-sm font-medium ${type === 'success' ? 'text-emerald-400' : 'text-rose-400'}">${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setLoadingState(btnId, isLoading, text) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (isLoading) {
                btn.dataset.original = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<div class="flex items-center justify-center gap-2"><div class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></div><span>${text}</span></div>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.original || 'Sign In';
            }
        }

        // Handle login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            setLoadingState('login-btn', true, 'Signing in...');

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showToast(error.message, 'error');
                    setLoadingState('login-btn', false);
                } else {
                    showToast('Welcome back!', 'success');
                    
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    if (user && user.email === "admin@whyjaba.com") {
                        setTimeout(() => {
                            window.location.href = "admin.html";
                        }, 500);
                    } else {
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 500);
                    }
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
                setLoadingState('login-btn', false);
            }
        });
    </script>
</body>
</html>
