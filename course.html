<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player - Jaba Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0A0F0C; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #EFF3EC; }
        .nav-blur { background: rgba(10, 15, 12, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(34, 197, 94, 0.2); }
        .lesson-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.75rem; }
        .lesson-item:hover { background: rgba(34, 197, 94, 0.08); border-color: rgba(34, 197, 94, 0.3); }
        .lesson-item.active { background: rgba(34, 197, 94, 0.12); border-color: #22c55e; }
        .lesson-number { width: 28px; height: 28px; border-radius: 0.5rem; background: rgba(34, 197, 94, 0.15); color: #22c55e; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .lesson-item.active .lesson-number { background: #22c55e; color: #0A0F0C; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 1rem; }
        .preview-badge { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); font-size: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 9999px; font-weight: 600; }
        .completed-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(34, 197, 94, 0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .completed-check.done { background: #22c55e; border-color: #22c55e; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.3s ease forwards; }
    </style>
</head>
<body>

    <nav class="nav-blur fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Jaba<span class="text-emerald-400">Shop</span></h1>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="text-sm text-gray-300 hover:text-emerald-400 transition">My Library</a>
                <button onclick="logout()" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-sm text-gray-300 hover:text-rose-400 transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pt-24 pb-16">
        <div id="loading-state" class="text-center py-20">
            <div class="w-12 h-12 border-2 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-gray-400">Loading course...</p>
        </div>

        <div id="course-content" class="hidden">
            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
                <a href="dashboard.html" class="hover:text-emerald-400 transition">My Library</a>
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
                <span id="course-category" class="text-emerald-400">Course</span>
            </div>

            <div class="grid lg:grid-cols-3 gap-6">
                <!-- Left: Video Player -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="video-container shadow-2xl shadow-emerald-500/10">
                        <iframe id="video-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>

                    <div class="animate-fade-up">
                        <div class="flex items-center gap-3 mb-2">
                            <span id="current-lesson-number" class="text-xs bg-emerald-500/15 text-emerald-400 px-2 py-0.5 rounded-full font-semibold">Lesson 1</span>
                            <span id="current-lesson-duration" class="text-xs text-gray-500 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> <span>0 min</span></span>
                        </div>
                        <h1 id="current-lesson-title" class="text-2xl font-bold text-white mb-2">Loading...</h1>
                        <p id="current-lesson-desc" class="text-gray-400 text-sm">Loading description...</p>

                        <div class="flex items-center gap-3 mt-4">
                            <button id="prev-btn" onclick="prevLesson()" class="px-4 py-2 rounded-full bg-white/5 border border-white/10 text-sm text-gray-300 hover:bg-emerald-500/10 hover:border-emerald-500/30 transition disabled:opacity-30 disabled:cursor-not-allowed">
                                ← Previous
                            </button>
                            <button id="next-btn" onclick="nextLesson()" class="px-4 py-2 rounded-full bg-emerald-500 text-black text-sm font-semibold hover:bg-emerald-400 transition disabled:opacity-30 disabled:cursor-not-allowed">
                                Next →
                            </button>
                            <button id="mark-complete-btn" onclick="toggleComplete()" class="ml-auto px-4 py-2 rounded-full bg-white/5 border border-white/10 text-sm text-gray-300 hover:bg-emerald-500/10 hover:text-emerald-400 transition flex items-center gap-2">
                                <i data-lucide="check-circle" class="w-4 h-4"></i>
                                <span>Mark Complete</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right: Lesson List -->
                <div class="lg:col-span-1">
                    <div class="bg-[#111813] rounded-2xl border border-white/10 p-5 sticky top-24">
                        <div class="flex items-center gap-3 mb-4">
                            <img id="course-cover" src="" class="w-12 h-12 rounded-lg object-cover" onerror="this.style.display='none'">
                            <div>
                                <h3 id="course-title" class="font-bold text-white text-sm">Loading...</h3>
                                <p id="course-meta" class="text-xs text-gray-500">0 lessons · 0 min</p>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="flex justify-between text-xs text-gray-400 mb-1">
                                <span>Progress</span>
                                <span id="progress-text">0%</span>
                            </div>
                            <div class="h-1.5 bg-white/10 rounded-full overflow-hidden">
                                <div id="progress-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>

                        <div id="lessons-container" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                            <!-- Lessons injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="error-state" class="hidden text-center py-20">
            <i data-lucide="alert-circle" class="w-16 h-16 text-rose-400 mx-auto mb-4"></i>
            <h2 class="text-xl font-bold text-white mb-2">Course not found</h2>
            <p class="text-gray-400 mb-6">This course doesn't exist or you don't have access.</p>
            <a href="dashboard.html" class="inline-flex items-center gap-2 px-6 py-3 bg-emerald-500 text-black font-semibold rounded-full hover:bg-emerald-400 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back to Library
            </a>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://wuwfjdxgeoqcbqsbxuho.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_6urNqkD2HYEHZtmVXSS8jQ_ByVqLB5T";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let courseId = null;
        let course = null;
        let lessons = [];
        let currentLessonIndex = 0;
        let completedLessons = new Set();

        function parseYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function formatDuration(minutes) {
            if (!minutes) return '0 min';
            if (minutes < 60) return `${minutes} min`;
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;

            const params = new URLSearchParams(window.location.search);
            courseId = params.get('id');
            if (!courseId) { showError(); return; }

            // Verify user owns this course
            const { data: receipt } = await supabaseClient
                .from('receipts')
                .select('*')
                .eq('user_id', user.id)
                .eq('book_id', courseId)
                .eq('status', 'approved')
                .single();

            if (!receipt) { showError(); return; }

            // Load course + lessons
            const [{ data: bookData }, { data: lessonsData }, { data: progressData }] = await Promise.all([
                supabaseClient.from('books').select('*').eq('id', courseId).single(),
                supabaseClient.from('lessons').select('*').eq('book_id', courseId).order('order_index', { ascending: true }),
                supabaseClient.from('user_lesson_progress').select('*').eq('user_id', user.id)
            ]);

            if (!bookData) { showError(); return; }

            course = bookData;
            lessons = lessonsData || [];
            progressData?.forEach(p => { if (p.completed) completedLessons.add(p.lesson_id); });

            renderCourse();
        }

        function showError() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            lucide.createIcons();
        }

        function renderCourse() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('course-content').classList.remove('hidden');

            // Course info
            document.getElementById('course-title').innerText = course.title;
            document.getElementById('course-category').innerText = course.category || 'Course';
            document.getElementById('course-cover').src = course.cover_url || '';

            const totalDuration = lessons.reduce((sum, l) => sum + (l.duration || 0), 0);
            document.getElementById('course-meta').innerText = `${lessons.length} lessons · ${formatDuration(totalDuration)}`;

            // Progress
            const progress = lessons.length > 0 ? Math.round((completedLessons.size / lessons.length) * 100) : 0;
            document.getElementById('progress-text').innerText = progress + '%';
            document.getElementById('progress-bar').style.width = progress + '%';

            // Render lesson list
            const container = document.getElementById('lessons-container');
            container.innerHTML = lessons.map((lesson, idx) => {
                const isActive = idx === currentLessonIndex;
                const isCompleted = completedLessons.has(lesson.id);
                const ytId = parseYouTubeId(lesson.video_url);
                const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : '';

                return `
                    <div class="lesson-item ${isActive ? 'active' : ''}" onclick="playLesson(${idx})">
                        <div class="lesson-number">${idx + 1}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <h4 class="text-sm font-medium ${isActive ? 'text-white' : 'text-gray-300'} truncate">${lesson.title}</h4>
                                ${lesson.is_preview ? '<span class="preview-badge">PREVIEW</span>' : ''}
                            </div>
                            <p class="text-xs text-gray-500">${formatDuration(lesson.duration)}</p>
                        </div>
                        <div class="completed-check ${isCompleted ? 'done' : ''}">
                            ${isCompleted ? '<i data-lucide="check" class="w-3 h-3 text-black"></i>' : ''}
                        </div>
                    </div>
                `;
            }).join('');

            loadLesson(0);
            lucide.createIcons();
        }

        function loadLesson(index) {
            if (index < 0 || index >= lessons.length) return;
            currentLessonIndex = index;
            const lesson = lessons[index];
            const ytId = parseYouTubeId(lesson.video_url);

            // Update player
            document.getElementById('video-player').src = ytId 
                ? `https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1`
                : '';

            // Update info
            document.getElementById('current-lesson-number').innerText = `Lesson ${index + 1}`;
            document.getElementById('current-lesson-duration').innerHTML = `<i data-lucide="clock" class="w-3 h-3"></i> ${formatDuration(lesson.duration)}`;
            document.getElementById('current-lesson-title').innerText = lesson.title;
            document.getElementById('current-lesson-desc').innerText = lesson.description || 'No description available.';

            // Update buttons
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === lessons.length - 1;

            // Update mark complete button
            const isCompleted = completedLessons.has(lesson.id);
            const markBtn = document.getElementById('mark-complete-btn');
            markBtn.innerHTML = isCompleted 
                ? '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i><span class="text-emerald-400">Completed</span>'
                : '<i data-lucide="check-circle" class="w-4 h-4"></i><span>Mark Complete</span>';

            // Update active lesson in sidebar
            document.querySelectorAll('.lesson-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
                el.querySelector('.lesson-number').classList.toggle('bg-emerald-500', i === index);
                el.querySelector('.lesson-number').classList.toggle('text-black', i === index);
                el.querySelector('h4').classList.toggle('text-white', i === index);
                el.querySelector('h4').classList.toggle('text-gray-300', i !== index);
            });

            // Scroll active lesson into view
            const activeEl = document.querySelectorAll('.lesson-item')[index];
            if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            lucide.createIcons();
        }

        function playLesson(index) {
            loadLesson(index);
        }

        function prevLesson() { loadLesson(currentLessonIndex - 1); }
        function nextLesson() { loadLesson(currentLessonIndex + 1); }

        async function toggleComplete() {
            const lesson = lessons[currentLessonIndex];
            if (!lesson) return;

            const isCompleted = completedLessons.has(lesson.id);

            if (isCompleted) {
                // Mark incomplete
                await supabaseClient.from('user_lesson_progress')
                    .delete()
                    .eq('user_id', currentUser.id)
                    .eq('lesson_id', lesson.id);
                completedLessons.delete(lesson.id);
            } else {
                // Mark complete
                await supabaseClient.from('user_lesson_progress')
                    .upsert({ 
                        user_id: currentUser.id, 
                        lesson_id: lesson.id, 
                        completed: true, 
                        completed_at: new Date().toISOString() 
                    });
                completedLessons.add(lesson.id);
            }

            renderCourse();
        }

        window.logout = async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; };
        window.prevLesson = prevLesson;
        window.nextLesson = nextLesson;
        window.playLesson = playLesson;
        window.toggleComplete = toggleComplete;

        init();
    </script>
</body>
                          </html>
