<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Jabaa Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Jabaa Shop - Reset Password</h2>
    <div id="status"></div>
    <div id="form" style="display:none;">
        <input type="password" id="password" placeholder="New Password (min 6 chars)">
        <br><br>
        <button onclick="updatePass()">Update Password</button>
    </div>

    <script>
        const supabase = supabase.createClient(
            'https://wuwfjdxgeoqcbqsbxuho.supabase.co',
            'sb_publishable_6urNqkD2HYEHZtmVXSS8jQ_ByVqLB5T'
        );

        const hash = window.location.hash.substring(1);
        const token = new URLSearchParams(hash).get('access_token');
        const type = new URLSearchParams(hash).get('type');

        if (!token || type !== 'recovery') {
            document.getElementById('status').innerHTML = '<p style="color:red;">Invalid or expired link. Request a new password reset.</p>';
        } else {
            supabase.auth.setSession({ access_token: token, refresh_token: token }).then(({ error }) => {
                if (error) {
                    document.getElementById('status').innerHTML = '<p style="color:red;">Error: ' + error.message + '</p>';
                } else {
                    document.getElementById('status').innerHTML = '<p style="color:green;">Verified! Enter your new password.</p>';
                    document.getElementById('form').style.display = 'block';
                }
            });
        }

        async function updatePass() {
            const newPass = document.getElementById('password').value;
            if (!newPass || newPass.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }
            const { error } = await supabase.auth.updateUser({ password: newPass });
            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Password updated! Redirecting...');
                window.location.href = 'https://www.jabashop.store/login';
            }
        }
    </script>
</body>
</html>
