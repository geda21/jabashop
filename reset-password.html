<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Jaba Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0F0C;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg-gradient-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 70% 30%, rgba(34, 197, 94, 0.08), transparent 50%),
                        radial-gradient(ellipse at 30% 80%, rgba(34, 197, 94, 0.05), transparent 50%);
            z-index: 0;
        }
        .floating-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.15), transparent);
            animation: float 20s infinite ease-in-out;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 20px) scale(1.1); }
        }
        .reset-card {
            background: rgba(18, 24, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 2rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .reset-card:hover {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1rem;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            color: white;
            width: 100%;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }
        .btn-primary {
            background: #22c55e;
            color: #0A0F0C;
            font-weight: 700;
            border-radius: 9999px;
            padding: 0.85rem 1.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn-primary:hover {
            background: #16a34a;
            transform: scale(0.98);
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .strength-meter {
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
            margin-top: 8px;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.5s ease forwards;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .logo-float {
            animation: floatLogo 4s ease-in-out infinite;
        }
        .hidden-form {
            display: none;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: #f87171;
            font-size: 0.875rem;
            text-align: center;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #0A0F0C;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg-gradient-animation"></div>
    
    <div class="floating-orb" style="width: 350px; height: 350px; top: -120px; right: -100px; animation-duration: 28s;"></div>
    <div class="floating-orb" style="width: 250px; height: 250px; bottom: -80px; left: -80px; animation-duration: 22s; animation-delay: -3s;"></div>

    <div class="w-full max-w-md px-4 relative z-10">
        <div class="text-center mb-8 animate-fade-up">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center shadow-2xl logo-float">
                    <i data-lucide="refresh-cw" class="w-10 h-10 text-white"></i>
                </div>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight" id="page-title">Set New Password</h1>
            <p class="text-gray-400 text-sm mt-2" id="page-subtitle">Create a strong password for your account</p>
        </div>

        <div class="reset-card p-8 animate-fade-up" style="animation-delay: 0.1s">
            <!-- Error message area -->
            <div id="error-container" class="error-message hidden-form">
                <i data-lucide="alert-circle" class="w-5 h-5 inline-block mr-2"></i>
                <span id="error-text"></span>
            </div>

            <!-- Loading state -->
            <div id="loading-state" class="text-center py-8">
                <div class="loading-spinner"></div>
                <p class="text-gray-400 text-sm mt-3">Verifying your reset link...</p>
            </div>

            <!-- Password reset form (hidden until token is verified) -->
            <form id="reset-password-form" class="space-y-4 hidden-form">
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">New Password</label>
                    <div class="relative">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="new-password" class="input-field" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-emerald-400 transition">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="strength-meter">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <p id="strength-text" class="text-[10px] text-gray-500 mt-1">Password strength</p>
                </div>

                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">
                            <i data-lucide="check" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="confirm-password" class="input-field" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="reset-btn" class="btn-primary py-3 text-base font-bold mt-4">
                    Update Password
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-gray-400 text-sm"><a href="login.html" class="text-emerald-400 font-semibold hover:text-emerald-300 transition">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = "https://wuwfjdxgeoqcbqsbxuho.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_6urNqkD2HYEHZtmVXSS8jQ_ByVqLB5T";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;

        // Initialize icons
        setTimeout(() => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }, 100);

        function showToast(message, type = 'success') {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `custom-toast fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-xl backdrop-blur-lg shadow-xl animate-fade-up ${type === 'success' ? 'bg-emerald-500/20 border border-emerald-500/30' : 'bg-rose-500/20 border border-rose-500/30'}`;
            toast.innerHTML = `
                <div class="w-2 h-2 rounded-full ${type === 'success' ? 'bg-emerald-400' : 'bg-rose-400'} animate-pulse"></div>
                <span class="text-sm font-medium ${type === 'success' ? 'text-emerald-400' : 'text-rose-400'}">${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            const errorText = document.getElementById('error-text');
            errorText.innerText = message;
            errorContainer.classList.remove('hidden-form');
            
            // Hide loading state
            document.getElementById('loading-state').classList.add('hidden-form');
        }

        function showForm() {
            document.getElementById('loading-state').classList.add('hidden-form');
            document.getElementById('reset-password-form').classList.remove('hidden-form');
            document.getElementById('error-container').classList.add('hidden-form');
            
            // Recreate icons for new elements
            setTimeout(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, 50);
        }

        function setLoadingState(btnId, isLoading, text) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (isLoading) {
                btn.dataset.original = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<div class="flex items-center justify-center gap-2"><div class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></div><span>${text}</span></div>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.original || 'Update Password';
            }
        }

        // ============ THE FIX: Get token from URL and set session ============
        async function handlePasswordReset() {
            // Get token from URL hash (after #)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const type = params.get('type');
            
            console.log('Token found:', accessToken ? 'Yes' : 'No');
            console.log('Type:', type);
            
            // Check if token exists and is for password recovery
            if (!accessToken) {
                showError('No reset token found. Please request a new password reset link.');
                return;
            }
            
            if (type !== 'recovery') {
                showError('Invalid reset link. Please request a new password reset.');
                return;
            }
            
            try {
                // Set the session using the token from URL
                const { data, error: sessionError } = await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: accessToken
                });
                
                if (sessionError) {
                    console.error('Session error:', sessionError);
                    showError(sessionError.message || 'Failed to verify reset link. Please request a new one.');
                    return;
                }
                
                console.log('Session set successfully! User can reset password.');
                // Token is valid, show the password reset form
                showForm();
                
            } catch (err) {
                console.error('Unexpected error:', err);
                showError('Something went wrong. Please try again or request a new reset link.');
            }
        }

        // Toggle password visibility
        const toggleBtn = document.getElementById('toggle-password');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const input = document.getElementById('new-password');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    if (icon) icon.setAttribute('data-lucide', 'eye-off');
                } else {
                    input.type = 'password';
                    if (icon) icon.setAttribute('data-lucide', 'eye');
                }
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            });
        }

        // Password strength checker
        const passwordInput = document.getElementById('new-password');
        if (passwordInput) {
            passwordInput.addEventListener('input', function(e) {
                const password = e.target.value;
                const bar = document.getElementById('strength-bar');
                const text = document.getElementById('strength-text');
                
                let strength = 0;
                if (password.length >= 6) strength += 25;
                if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 25;
                if (password.match(/[0-9]/)) strength += 25;
                if (password.match(/[^a-zA-Z0-9]/)) strength += 25;
                
                if (bar) bar.style.width = strength + '%';
                
                if (strength <= 25) {
                    if (bar) bar.style.backgroundColor = '#ef4444';
                    if (text) {
                        text.innerHTML = 'Weak password';
                        text.style.color = '#ef4444';
                    }
                } else if (strength <= 50) {
                    if (bar) bar.style.backgroundColor = '#f59e0b';
                    if (text) {
                        text.innerHTML = 'Fair password';
                        text.style.color = '#f59e0b';
                    }
                } else if (strength <= 75) {
                    if (bar) bar.style.backgroundColor = '#3b82f6';
                    if (text) {
                        text.innerHTML = 'Good password';
                        text.style.color = '#3b82f6';
                    }
                } else {
                    if (bar) bar.style.backgroundColor = '#22c55e';
                    if (text) {
                        text.innerHTML = 'Strong password!';
                        text.style.color = '#22c55e';
                    }
                }
            });
        }

        // Form submission handler
        const resetForm = document.getElementById('reset-password-form');
        if (resetForm) {
            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (newPassword !== confirmPassword) {
                    showToast('Passwords do not match!', 'error');
                    return;
                }
                
                if (newPassword.length < 6) {
                    showToast('Password must be at least 6 characters', 'error');
                    return;
                }
                
                setLoadingState('reset-btn', true, 'Updating...');

                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    showToast(error.message, 'error');
                    setLoadingState('reset-btn', false);
                } else {
                    showToast('Password updated successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                }
            });
        }

        // Start the password reset process
        handlePasswordReset();
    </script>
</body>
</html>
