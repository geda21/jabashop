name: Encrypted Supabase database backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate required GitHub secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL secret"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Missing BACKUP_PASSPHRASE secret"; exit 1; }
          test "${#BACKUP_PASSPHRASE}" -ge 20 || { echo "BACKUP_PASSPHRASE needs at least 20 characters"; exit 1; }

      - name: Stream database dump directly into encrypted file
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          BACKUP_FILE="jabashop-db-$(date -u +%Y%m%d-%H%M%S).dump.enc"
          docker run --rm -e SUPABASE_DB_URL postgres:17-alpine             sh -c 'exec pg_dump --dbname="$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --schema=public --schema=auth --schema=storage'             | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000                 -pass env:BACKUP_PASSPHRASE -out "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "Encrypted backup created successfully"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: jabashop-supabase-encrypted-backup
          path: ${{ env.BACKUP_FILE }}
          if-no-files-found: error
          retention-days: 7
