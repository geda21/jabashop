<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6487607786586240"
        crossorigin="anonymous"></script>
    <title>Forgot Password - Jaba Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0F0C;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg-gradient-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, rgba(34, 197, 94, 0.08), transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(34, 197, 94, 0.05), transparent 50%);
            z-index: 0;
        }
        .floating-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.15), transparent);
            animation: float 20s infinite ease-in-out;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
        }
        .forgot-card {
            background: rgba(18, 24, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 2rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .forgot-card:hover {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 1rem;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            color: white;
            width: 100%;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }
        .btn-primary {
            background: #22c55e;
            color: #0A0F0C;
            font-weight: 700;
            border-radius: 9999px;
            padding: 0.85rem 1.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn-primary:hover {
            background: #16a34a;
            transform: scale(0.98);
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.5s ease forwards;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .logo-float {
            animation: floatLogo 4s ease-in-out infinite;
        }
        .back-link {
            transition: all 0.2s;
        }
        .back-link:hover {
            color: #22c55e;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>
    <div class="bg-gradient-animation"></div>
    
    <div class="floating-orb" style="width: 300px; height: 300px; top: -100px; right: -100px; animation-duration: 25s;"></div>
    <div class="floating-orb" style="width: 200px; height: 200px; bottom: -50px; left: -50px; animation-duration: 18s; animation-delay: -5s;"></div>

    <a href="login.html" class="fixed top-6 left-6 z-50 flex items-center gap-2 text-gray-400 hover:text-emerald-400 transition text-sm back-link">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Sign In
    </a>

    <div class="w-full max-w-md px-4 relative z-10">
        <div class="text-center mb-8 animate-fade-up">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center shadow-2xl logo-float">
                    <i data-lucide="key" class="w-10 h-10 text-white"></i>
                </div>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Forgot Password?</h1>
            <p class="text-gray-400 text-sm mt-2">Enter your email to receive a reset link</p>
        </div>

        <div class="forgot-card p-8 animate-fade-up" style="animation-delay: 0.1s">
            <form id="reset-form" class="space-y-5">
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input type="email" id="email" class="input-field" placeholder="you@example.com" required>
                    </div>
                </div>

                <button type="submit" id="reset-btn" class="btn-primary py-3 text-base font-bold mt-4">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-gray-400 text-sm">Remember your password? <a href="login.html" class="text-emerald-400 font-semibold hover:text-emerald-300 transition">Sign in</a></p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wuwfjdxgeoqcbqsbxuho.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_6urNqkD2HYEHZtmVXSS8jQ_ByVqLB5T";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;

        lucide.createIcons();

        function showToast(message, type = 'success') {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `custom-toast fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-xl backdrop-blur-lg shadow-xl animate-fade-up ${type === 'success' ? 'bg-emerald-500/20 border border-emerald-500/30' : 'bg-rose-500/20 border border-rose-500/30'}`;
            toast.innerHTML = `
                <div class="w-2 h-2 rounded-full ${type === 'success' ? 'bg-emerald-400' : 'bg-rose-400'} animate-pulse"></div>
                <span class="text-sm font-medium ${type === 'success' ? 'text-emerald-400' : 'text-rose-400'}">${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setLoadingState(btnId, isLoading, text) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (isLoading) {
                btn.dataset.original = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<div class="flex items-center justify-center gap-2"><div class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></div><span>${text}</span></div>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.original || 'Send Reset Link';
            }
        }

        function getRedirectUrl(page) {
            const url = window.location.href;
            const lastSlash = url.lastIndexOf('/');
            return url.substring(0, lastSlash + 1) + page;
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            setLoadingState('reset-btn', true, 'Sending...');

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: getRedirectUrl('reset-password.html'),
            });

            if (error) {
                showToast(error.message, 'error');
                setLoadingState('reset-btn', false);
            } else {
                showToast('Reset link sent to your email! Check inbox.', 'success');
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 3000);
            }
        });
    </script>
</body>
</html>
